plugins {
    id 'com.gradle.develocity' version '4.0.2'
}

rootProject.name = 'git-hooks-plugin'

develocity {
    buildScan {
        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'

        publishing.onlyIf { System.getenv('CI') != null && !System.getenv('CI').isEmpty() }
    }
}
