name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          lfs: true
          fetch-depth: 0
      
      - name: Reset branch to workflow HEAD
        run: git reset --hard "${{ github.event.workflow_run.head_sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create release tag (axion-release)
        run: ./gradlew release pushRelease
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Run githubRelease
        run: ./gradlew githubRelease
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
